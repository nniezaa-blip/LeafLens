include: lint_options.yaml

analyzer:
  exclude:
    - "build/**"
    - ".dart_tool/**"
    - "tools/**"
    - "packages/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
